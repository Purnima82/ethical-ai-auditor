services:
  - type: web
    name: ethical-ai-auditor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false          
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://ethical-ai-auditor.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.0"
